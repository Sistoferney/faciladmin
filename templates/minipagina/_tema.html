<!-- Colores del negocio: se incluye después de Bootstrap -->
<style>
    :root {
        --negocio-primary: {{ negocio.color_primario }};
        --negocio-secondary: {{ negocio.color_secundario }};
        /* Barra y botones: color sólido, o degradado si el dueño lo activó */
        --negocio-fondo: {% if negocio.usar_degradado %}linear-gradient(90deg, {{ negocio.color_primario }}, {{ negocio.color_secundario }}){% else %}{{ negocio.color_primario }}{% endif %};
        --negocio-texto: {{ negocio.texto_sobre_marca }};
        /* Portada sin imagen y encabezado de agendar: siempre con los dos colores */
        --negocio-degradado: linear-gradient({% if negocio.usar_degradado %}90deg{% else %}135deg{% endif %}, {{ negocio.color_primario }}, {{ negocio.color_secundario }});
        --negocio-texto-degradado: {{ negocio.texto_sobre_degradado }};
        /* Textos e íconos sobre fondo blanco */
        --negocio-acento: {{ negocio.color_acento }};
        --negocio-acento-rgb: {{ negocio.color_acento_rgb }};
        --bs-primary-rgb: {{ negocio.color_acento_rgb }};
        --bs-link-color-rgb: {{ negocio.color_acento_rgb }};
        --bs-link-hover-color-rgb: {{ negocio.color_acento_rgb }};
    }

    .navbar {
        background: var(--negocio-fondo) !important;
    }

    .navbar .nav-link {
        color: var(--negocio-texto);
    }

    .btn-primary {
        --bs-btn-color: var(--negocio-texto);
        --bs-btn-hover-color: var(--negocio-texto);
        --bs-btn-active-color: var(--negocio-texto);
        --bs-btn-disabled-color: var(--negocio-texto);
        background: var(--negocio-fondo) !important;
        background-origin: border-box !important;
        border-color: transparent !important;
    }

    .btn-primary:hover {
        filter: brightness(0.92);
    }

    /* Diseño de la mini-página (marca-minipagina.css) con los colores del negocio */
    .mp .fa-btn--accent,
    .mp .fa-btn--primary {
        --btn-bg: var(--negocio-fondo);
        --btn-bd: transparent;
        --btn-fg: var(--negocio-texto);
        background-origin: border-box;
    }
    .mp .mp-nav a.fa-btn { color: var(--btn-fg); }
    .mp .fa-btn--accent:hover,
    .mp .fa-btn--primary:hover { filter: brightness(.92); }
    .mp-header { border-top: 4px solid transparent; border-image: var(--negocio-fondo) 1; border-image-slice: 1; }
    .mp-brand { color: var(--negocio-acento); }
    .mp-brand__mark { background: var(--negocio-fondo); color: var(--negocio-texto); }
    .mp-brand__logo { max-height: 52px; max-width: min(220px, 50vw); width: auto; }
    .mp-brand { min-width: 0; }
    .mp-brand__mark { flex: none; }
    .mp-brand__nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 480px) { .mp-brand__nombre { max-width: 34vw; } }
    .mp-cover { background: var(--negocio-degradado); }
    .mp-cover::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, .7) 100%); }
    .mp-cover__meta .fa-icon { color: var(--fa-white); }
    .mp-cover .fa-tag { background: rgba(0, 0, 0, .3); }
    .mp :where(h2, h3, .mp-price) { color: var(--negocio-acento); }
    .mp .fa-eyebrow { color: var(--negocio-acento); }
    .mp .fa-eyebrow::before { background: var(--negocio-acento); }
    .mp .mp-cover h1 { color: var(--fa-white); }
    .mp-footer { background: var(--fa-navy); }
    .mp .alert { border: 0; border-left: 4px solid; border-radius: var(--fa-r); }
    .mp .alert-info { background: var(--fa-royal-soft); border-left-color: var(--negocio-acento); color: var(--fa-ink); }
    .mp .alert-warning { background: var(--fa-orange-soft); border-left-color: var(--fa-orange); color: var(--fa-ink); }
    .mp .card { border: 1px solid var(--fa-line); border-radius: var(--fa-r-lg); }

    .btn-outline-primary {
        --bs-btn-color: var(--negocio-acento);
        --bs-btn-border-color: var(--negocio-acento);
        --bs-btn-hover-bg: var(--negocio-acento);
        --bs-btn-hover-border-color: var(--negocio-acento);
        --bs-btn-active-bg: var(--negocio-acento);
        --bs-btn-active-border-color: var(--negocio-acento);
    }
</style>
