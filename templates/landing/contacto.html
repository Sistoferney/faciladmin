{% extends 'landing/base_landing.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mb-5 mb-lg-0">
                <h1 class="display-5 fw-bold mb-4">Contáctanos</h1>
                <p class="lead text-muted mb-4">
                    ¿Tienes preguntas? Estamos aquí para ayudarte.
                </p>

                <div class="mb-4">
                    <div class="d-flex mb-3">
                        <div class="flex-shrink-0">
                            <i class="bi bi-envelope-fill text-primary fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-1">Email</h6>
                            <a href="mailto:contacto@faciladmin.com" class="text-decoration-none">
                                contacto@faciladmin.com
                            </a>
                        </div>
                    </div>

                    <div class="d-flex mb-3">
                        <div class="flex-shrink-0">
                            <i class="bi bi-whatsapp text-primary fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-1">WhatsApp</h6>
                            <a href="https://wa.me/525512345678" class="text-decoration-none">
                                +52 55 1234 5678
                            </a>
                        </div>
                    </div>

                    <div class="d-flex">
                        <div class="flex-shrink-0">
                            <i class="bi bi-clock-fill text-primary fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-1">Horario de Atención</h6>
                            <p class="mb-0 text-muted">Lunes a Viernes: 9:00 AM - 6:00 PM</p>
                        </div>
                    </div>
                </div>

                <div class="mt-5">
                    <h5 class="mb-3">Síguenos</h5>
                    <a href="#" class="btn btn-outline-primary rounded-circle me-2">
                        <i class="bi bi-facebook"></i>
                    </a>
                    <a href="#" class="btn btn-outline-primary rounded-circle me-2">
                        <i class="bi bi-instagram"></i>
                    </a>
                    <a href="#" class="btn btn-outline-primary rounded-circle me-2">
                        <i class="bi bi-twitter"></i>
                    </a>
                    <a href="#" class="btn btn-outline-primary rounded-circle">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <h4 class="mb-4">Envíanos un Mensaje</h4>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" placeholder="Tu nombre completo">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="tu@email.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Asunto</label>
                                <select class="form-control">
                                    <option>Consulta General</option>
                                    <option>Soporte Técnico</option>
                                    <option>Ventas</option>
                                    <option>Otro</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mensaje</label>
                                <textarea class="form-control" rows="5" placeholder="Cuéntanos cómo podemos ayudarte..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary-gradient w-100 py-2">
                                <i class="bi bi-send-fill me-2"></i> Enviar Mensaje
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
